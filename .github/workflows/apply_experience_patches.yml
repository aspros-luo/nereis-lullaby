name: Apply playable experience patches
on:
  push:
    paths:
      - "patches/**"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply all patches
        run: |
          set -e
          for f in $(ls patches/*.patch | sort); do
            echo "Applying $f"
            patch -p1 -N < "$f" || true
          done
      - name: Commit if changed
        run: |
          git config user.name "playable-bot"
          git config user.email "playable-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Apply experience patches from patches/"
            git push
          fi
