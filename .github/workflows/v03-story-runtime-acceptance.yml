name: v0.3 Story Runtime Acceptance

on:
  push:
    branches:
      - feature/v0.3-mainline-runtime-test
  workflow_dispatch:

jobs:
  story-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.6.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl -L --fail --retry 3 \
            -o "$HOME/godot/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          mv "$HOME/godot/Godot_v4.6.1-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          godot --version

      - name: Verify project parses
        run: godot --headless --path . --editor --quit --check-only

      - name: Run v0.3 story runtime acceptance
        run: godot --headless --path . --script res://tests/v03_story_runtime_acceptance.gd
