name: Apply playable experience patches
on:
  push:
    paths:
      - "patches/**"
      - "scripts/tools/apply_*.py"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Python appliers
        run: |
          set -e
          shopt -s nullglob
          for f in scripts/tools/apply_*.py; do
            echo "Running $f"
            python3 "$f"
          done
      - name: Commit if changed
        run: |
          git config user.name "playable-bot"
          git config user.email "playable-bot@users.noreply.github.com"
          git add scripts/ui/main_shell.gd scripts/systems/daily/pre_festival_events.gd || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Apply experience wiring via scripts/tools"
            git push
          fi
